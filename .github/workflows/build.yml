name: Build Geverb

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g. v1.0.0). Leave empty to only upload Actions artifacts."
        required: false
        type: string
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths:
      - "Source/**"
      - "Resources/**"
      - "Tests/**"
      - "Tools/**"
      - "CMakeLists.txt"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DGEVERB_BUILD_SCREENSHOT=OFF `
            -DGEVERB_BUILD_HOST_TEST=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run DSP tests
        shell: pwsh
        run: |
          & "build-windows\GeverbTests_artefacts\Release\GeverbTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run VST3 host test
        shell: pwsh
        run: |
          & "build-windows\GeverbHostSmokeTest_artefacts\Release\GeverbHostSmokeTest.exe" `
            "build-windows\Geverb_artefacts\Release\VST3\Geverb.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows distribution
        shell: pwsh
        run: |
          $stage = "stage-windows"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item -Recurse -Force "build-windows\Geverb_artefacts\Release\VST3\*.vst3" $stage
          Copy-Item -Force "build-windows\Geverb_artefacts\Release\Standalone\*.exe" $stage
          if (Test-Path "README.md") { Copy-Item -Force "README.md" $stage }
          if (Test-Path "Resources\Lato-OFL.txt") { Copy-Item -Force "Resources\Lato-OFL.txt" $stage }

          $versionMatch = Select-String -Path "CMakeLists.txt" -Pattern 'project\(\s*[A-Za-z0-9_-]+\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $versionMatch -or $versionMatch.Matches.Count -eq 0) { throw "Could not read project version from CMakeLists.txt" }
          $version = $versionMatch.Matches[0].Groups[1].Value

          $zip = "Geverb-Windows-x64-v$version.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "Geverb-Windows-x64-v$version.sha256"
          Get-Item $zip | Format-List Name, Length

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Geverb-Windows-x64
          path: |
            Geverb-Windows-x64-v*.zip
            Geverb-Windows-x64-v*.sha256
          if-no-files-found: error

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config zip \
            libasound2-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libxrender-dev libxfixes-dev libxi-dev libsm-dev libice-dev \
            libx11-xcb-dev libxcb1-dev \
            libexpat1-dev zlib1g-dev libpng-dev libbrotli-dev libbz2-dev

          if apt-cache show libfreetype-dev >/dev/null 2>&1; then
            FREETYPE_PACKAGE=libfreetype-dev
          else
            FREETYPE_PACKAGE=libfreetype6-dev
          fi

          if apt-cache show libfontconfig-dev >/dev/null 2>&1; then
            FONTCONFIG_PACKAGE=libfontconfig-dev
          else
            FONTCONFIG_PACKAGE=libfontconfig1-dev
          fi

          sudo apt-get install -y --no-install-recommends "$FREETYPE_PACKAGE" "$FONTCONFIG_PACKAGE"

      - name: Configure
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEVERB_BUILD_SCREENSHOT=OFF \
            -DGEVERB_BUILD_HOST_TEST=ON

      - name: Build
        run: cmake --build build-linux --parallel

      - name: Run DSP tests
        run: ./build-linux/GeverbTests_artefacts/Release/GeverbTests

      - name: Run VST3 host test
        run: |
          ./build-linux/GeverbHostSmokeTest_artefacts/Release/GeverbHostSmokeTest \
            build-linux/Geverb_artefacts/Release/VST3/Geverb.vst3

      - name: Package Linux distribution
        run: |
          set -euo pipefail

          VERSION="$(sed -nE 's/^project\([A-Za-z0-9_-]+[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          if [ -z "$VERSION" ]; then
            echo "Could not read project version from CMakeLists.txt" >&2
            exit 1
          fi

          STAGE="stage-linux"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp -a build-linux/Geverb_artefacts/Release/VST3/Geverb.vst3 "$STAGE/"
          cp build-linux/Geverb_artefacts/Release/Standalone/Geverb "$STAGE/"
          [ -f README.md ] && cp README.md "$STAGE/"
          [ -f Resources/Lato-OFL.txt ] && cp Resources/Lato-OFL.txt "$STAGE/"

          find "$STAGE" -type f \( -name "*.so" -o -perm -111 \) -exec strip --strip-unneeded {} + 2>/dev/null || true

          ZIP="Geverb-Linux-x64-v${VERSION}.zip"
          (cd "$STAGE" && zip -q -r "../${ZIP}" .)
          sha256sum "$ZIP" > "Geverb-Linux-x64-v${VERSION}.sha256"

          ls -lh "$ZIP"
          cat "Geverb-Linux-x64-v${VERSION}.sha256"

      - name: Upload Linux distribution
        uses: actions/upload-artifact@v4
        with:
          name: Geverb-Linux-x64
          path: |
            Geverb-Linux-x64-v*.zip
            Geverb-Linux-x64-v*.sha256
          if-no-files-found: error

  macos-universal:
    name: macOS Universal
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Ninja
        run: brew install ninja

      - name: Configure Universal Binary (arm64 + x86_64)
        run: |
          cmake -S . -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DGEVERB_BUILD_SCREENSHOT=OFF \
            -DGEVERB_BUILD_HOST_TEST=ON

      - name: Build
        run: cmake --build build-macos --parallel

      - name: Ad-hoc sign macOS bundles
        run: |
          for bundle in build-macos/Geverb_artefacts/Release/VST3/*.vst3 \
                        build-macos/Geverb_artefacts/Release/Standalone/*.app; do
            if [ -e "$bundle" ]; then
              codesign --force --deep --sign - "$bundle"
            fi
          done

      - name: Run DSP tests
        run: ./build-macos/GeverbTests_artefacts/Release/GeverbTests

      - name: Run VST3 host test
        run: |
          ./build-macos/GeverbHostSmokeTest_artefacts/Release/GeverbHostSmokeTest \
            build-macos/Geverb_artefacts/Release/VST3/Geverb.vst3

      - name: Package macOS distribution
        run: |
          set -euo pipefail

          VERSION="$(sed -nE 's/^project\([A-Za-z0-9_-]+[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          if [ -z "$VERSION" ]; then
            echo "Could not read project version from CMakeLists.txt" >&2
            exit 1
          fi

          STAGE="stage-macos"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp -R build-macos/Geverb_artefacts/Release/VST3/Geverb.vst3 "$STAGE/"
          cp -R build-macos/Geverb_artefacts/Release/Standalone/Geverb.app "$STAGE/"
          [ -f README.md ] && cp README.md "$STAGE/"
          [ -f Resources/Lato-OFL.txt ] && cp Resources/Lato-OFL.txt "$STAGE/"

          ZIP="Geverb-macOS-Universal-v${VERSION}.zip"
          ditto -c -k --sequesterRsrc "$STAGE" "$ZIP"
          shasum -a 256 "$ZIP" > "Geverb-macOS-Universal-v${VERSION}.sha256"

          ls -lh "$ZIP"
          cat "Geverb-macOS-Universal-v${VERSION}.sha256"

      - name: Upload macOS distribution
        uses: actions/upload-artifact@v4
        with:
          name: Geverb-macOS-Universal
          path: |
            Geverb-macOS-Universal-v*.zip
            Geverb-macOS-Universal-v*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs: [ windows-x64, linux-x64, macos-universal ]
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: Geverb-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Geverb ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-assets/*.zip
            release-assets/*.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
